<title>タグ絞り込み — 設計サンプル #323</title>
<style>
:root{font-family:"Segoe UI","Yu Gothic UI",sans-serif;color:#19334a;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;font-size:15px}button,input,select{font:inherit;color:inherit}button{background:white;border:1px solid #b5c6d3;border-radius:6px;padding:8px 13px;min-height:40px;cursor:pointer}button:hover:not(:disabled){background:#e4edf3}button:disabled{opacity:.5;cursor:default}input,select{padding:9px 11px;border:1px solid #afbfce;border-radius:6px;background:white;min-width:0;min-height:42px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #298ba9;outline-offset:2px}.sample{padding:9px 20px;background:#e7eef3;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.sample select{font-size:12px;min-height:32px;padding:5px;max-width:190px}main{max-width:1240px;padding:20px 28px 40px;margin:auto}h1{font-size:25px;margin:0 0 18px}h2{font-size:19px;margin:0}p{margin:0}.library{background:white;border:1px solid #d5dfe8;border-radius:10px;padding:20px}.head,.tools,.conditions,.actions,.page{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.head{justify-content:space-between;margin-bottom:14px}.muted{color:#64778b;font-size:13px}.tools{align-items:flex-end}.title-search{flex:1 1 230px}.title-search label{display:block;font-size:13px;margin-bottom:5px}.title-search input{width:100%}.anchor{position:relative}.primary{background:#276078;color:white;border-color:#276078}.primary:hover:not(:disabled){background:#174e65}.conditions{margin-top:12px;align-items:flex-start}.chip{background:#eaf2f7;border-color:#b9d1df;max-width:100%;text-align:left;overflow-wrap:anywhere;padding:6px 10px;min-height:36px;font-size:13px}.chip span{margin-left:10px}.link{border:0;background:transparent;text-decoration:underline;font-size:13px;padding:6px;min-height:36px}.popup{position:absolute;right:0;top:calc(100% + 8px);width:355px;max-width:calc(100vw - 40px);z-index:5;background:#fff;border:1px solid #b6c8d6;border-radius:10px;box-shadow:0 12px 35px #1c39532b;padding:15px}.popup-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}.popup-head button{border:0;min-height:30px;padding:2px 9px;font-size:21px}.popup input[type=search]{width:100%}.help{font-size:12px;color:#63758b;line-height:1.7;margin:9px 0}.candidates{max-height:270px;overflow:auto;border-top:1px solid #e0e7ee;margin-top:10px}.candidate{display:flex;align-items:center;gap:10px;padding:10px 5px;border-bottom:1px solid #e8edf2;cursor:pointer;line-height:1.5}.candidate:hover{background:#edf4f8}.candidate input{accent-color:#276078;width:18px;height:18px;min-height:18px;flex-shrink:0}.candidate .name{flex:1;min-width:0;overflow-wrap:anywhere}.candidate .count{font-size:13px;white-space:nowrap;color:#62778a}.result-line{display:flex;justify-content:space-between;margin:16px 0 9px;font-size:13px;gap:12px;flex-wrap:wrap}.works{border:1px solid #dce4eb;border-radius:7px;overflow:hidden}.work{display:grid;grid-template-columns:50px minmax(0,1fr) 125px 55px;gap:16px;padding:13px 15px;align-items:center;border-bottom:1px solid #e0e7ee}.work:nth-child(even){background:#f1f5f8}.work:last-child{border:0}.work:hover{background:#dfeaf2}.cover{height:64px;background:linear-gradient(145deg,#b5d6ce,#597a97);border-radius:4px;display:grid;place-items:center;color:white;font-size:22px}.work strong{font-size:18px;display:block;line-height:1.5;overflow-wrap:anywhere}.work .url{font-size:12px;color:#466e88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.work .tags{font-size:12px;color:#64778b;margin-top:5px;line-height:1.6;overflow-wrap:anywhere}.date{font-size:12px;line-height:1.8}.empty{text-align:center;padding:35px 15px;line-height:1.9}.empty button{margin-top:12px}.notice{background:#fff4d9;border:1px solid #e1c58a;padding:11px 13px;font-size:13px;line-height:1.8;border-radius:6px;margin-top:12px}.notice button{margin:6px 0 0 10px;font-size:13px}.page{justify-content:center;margin-top:18px;font-size:13px}.page strong{background:#e8f1f5;padding:10px 15px;border-radius:5px}.hidden{display:none!important}.footnote{font-size:12px;color:#62758a;margin-top:12px;line-height:1.8}
@media(max-width:650px){main{padding:18px 12px}.library{padding:14px}.sample{padding:8px 12px;align-items:flex-start}.sample span{max-width:190px}.sample select{max-width:140px}h1{font-size:23px}.tools .title-search{flex-basis:100%}.tools select{flex:1}.anchor{position:static}.tools{position:relative}.popup{right:0;top:calc(100% + 8px);width:100%;max-width:100%}.work{grid-template-columns:40px minmax(0,1fr) 44px;gap:10px;padding:12px 10px}.cover{height:56px}.date{grid-column:2;grid-row:2}.more{grid-column:3;grid-row:1}.work strong{font-size:17px}.candidates{max-height:235px}}
</style>
<div class="sample"><span>設計サンプル #323 · 合成データのみ<br>保存・外部起動は行いません</span><label>状態 <select id="scenario"><option value="normal">通常</option><option value="many">選択タグが多い</option><option value="zero">0件に絞り込み</option><option value="failed">再取得失敗</option><option value="initial">初回取得失敗</option><option value="deleted">選択タグの削除後</option></select></label></div>
<main><h1>作品を管理</h1><section class="library"><div class="head"><h2>登録した作品 <small id="total" class="muted"></small></h2><span class="muted">行一覧 · 設計確認用</span></div>
<div class="tools"><div class="title-search"><label for="query">漫画名で検索</label><input id="query" type="search" placeholder="タイトルで絞り込み"></div><select id="sort" aria-label="並び順"><option value="registration">登録：古い順</option><option value="title">タイトル：昇順</option></select><div class="anchor"><button id="toggle" aria-expanded="false" aria-controls="popup">タグで絞り込み</button><section id="popup" class="popup hidden" aria-label="タグで絞り込み"><div class="popup-head"><span>タグで絞り込み</span><button id="close" aria-label="タグ候補を閉じる">×</button></div><input id="tag-query" type="search" aria-label="タグ候補を検索" placeholder="タグ名で検索"><p class="help">選んだタグをすべて持つ作品を表示します。<br>件数は、今の条件にこのタグを加えた場合です。</p><div id="candidate-status"></div><div id="candidates" class="candidates"></div></section></div></div>
<div id="conditions" class="conditions" aria-label="選択中のタグ"></div><div id="notice" class="notice hidden" role="status"></div><div class="result-line"><span id="result" role="status" aria-live="polite"></span><span class="muted">予定条件：なし</span></div><div id="works" class="works"></div><nav id="pages" class="page" aria-label="ページ切り替え"></nav></section><p class="footnote">タグ名の下の補助表示・状態切替はサンプル確認用です。製品画面への採用を確定するものではありません。</p></main>
<script>
const $=id=>document.getElementById(id);
const normalize=s=>s.replace(/[\uFF00-\uFFEF]+/g,x=>x.normalize('NFKC')).replace(/\u3000/g,' ').normalize('NFC').toLowerCase();
const collator=new Intl.Collator('ja',{numeric:true});
const originalTags=['ファンタジー','毎週更新','毎月更新','マンガ','シリーズ2','シリーズ10','休日にまとめて読みたいお気に入りの長い名前のタグ','未使用'];
let tags=[...originalTags],selected=new Set([0]),page=1,failed=false,initial=false,notification='';
const works=Array.from({length:30},(_,i)=>({id:i+1,title:['架空の冒険物語','星を巡る旅','小さな書店の日々','魔法使いの休日','森の向こうの街'][i%5]+(Math.floor(i/5)+1),tags:[...(i%3!==2?[0]:[]),i%2===0?1:2,...(i%4===0?[3]:[]),...(i%5===0?[4,5,6]:[])]}));
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
function matching(ids=selected){const q=normalize($('query').value).trim();return works.filter(w=>normalize(w.title).includes(q)&&[...ids].every(id=>w.tags.includes(id)))}
function updateCondition(id){if(failed||initial)return;selected.has(id)?selected.delete(id):selected.add(id);page=1;render()}
function renderCandidates(){const host=$('candidates');host.replaceChildren();const q=normalize($('tag-query').value).trim();const list=tags.map((name,id)=>({name,id})).filter(t=>t.name&&normalize(t.name).includes(q)).sort((a,b)=>collator.compare(a.name,b.name)||a.id-b.id);$('candidate-status').replaceChildren();if(failed||initial){const text=el('p',initial?'タグ情報を取得できませんでした。':'最新情報は未確認です。', 'help');const retry=el('button','再読み込み');retry.onclick=()=>{failed=false;initial=false;notification='タグ情報を再取得しました。';render()};$('candidate-status').append(text,retry)}if(initial)return;
 for(const t of list){const row=el('label',null,'candidate'),check=el('input');check.type='checkbox';check.checked=selected.has(t.id);check.disabled=failed;check.dataset.tag=t.id;check.onchange=()=>updateCondition(t.id);row.append(check,el('span',t.name,'name'),el('span',matching(new Set([...selected,t.id])).length+'作品','count'));host.append(row)}if(!list.length)host.append(el('p','一致するタグはありません。','help'))}
function render(){const focusId=document.activeElement?.dataset.tag;const qFocus=document.activeElement?.id;renderCandidates();const chips=$('conditions');chips.replaceChildren();for(const id of selected){const b=el('button',tags[id]+' ×','chip');b.disabled=failed||initial;b.setAttribute('aria-label',tags[id]+'の条件を解除');b.onclick=()=>{updateCondition(id);$('toggle').focus()};chips.append(b)}if(selected.size){const clear=el('button','すべて解除','link');clear.disabled=failed||initial;clear.onclick=()=>{selected.clear();page=1;render();$('toggle').focus()};chips.append(clear)}$('toggle').textContent='タグで絞り込み'+(selected.size?' ('+selected.size+')':'');$('total').textContent='30作品';$('notice').classList.toggle('hidden',!notification&&!failed&&!initial);$('notice').textContent=initial?'タグ情報を取得できませんでした。タグによる絞り込みはまだ利用できません。':failed?'タグの最新情報は未確認です。前回の条件と一覧を表示しています。再読み込みするまでタグ条件は変更できません。':notification;
 const found=matching();if($('sort').value==='title')found.sort((a,b)=>collator.compare(a.title,b.title));page=Math.min(page,Math.max(1,Math.ceil(found.length/6)));$('result').textContent=found.length+'件／全30件'+(selected.size?' · 選択タグすべてに一致':'');const container=$('works');container.replaceChildren();for(const w of found.slice((page-1)*6,page*6)){const row=el('article',null,'work'),info=el('div');info.append(el('strong',w.title),el('p','https://example.com/works/'+w.id,'url'),el('p',w.tags.filter(id=>tags[id]).map(id=>tags[id]).join(' · '),'tags'));const more=el('button','⋯','more');more.setAttribute('aria-label',w.title+'の操作（サンプルでは実行しません）');more.onclick=()=>{notification='作品の編集・削除は、このサンプルでは実行しません。';render()};row.append(el('div','本','cover'),info,el('p','更新予定 未設定','date'),more);container.append(row)}if(!found.length){const empty=el('div',null,'empty');empty.append(el('p','すべての条件に一致する作品がありません。'),el('p','漫画名や選択タグの条件を減らしてください。'));if(selected.size){const b=el('button','タグ条件をすべて解除');b.disabled=failed;b.onclick=()=>{selected.clear();page=1;render();$('toggle').focus()};empty.append(b)}container.append(empty)}
 const nav=$('pages');nav.replaceChildren();if(found.length){const prev=el('button','前へ'),next=el('button','次へ');prev.disabled=page===1;next.disabled=page*6>=found.length;prev.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};nav.append(prev,el('strong',page+' / '+Math.ceil(found.length/6)),next)}if(focusId!==undefined)$('candidates').querySelector('input[data-tag="'+focusId+'"]')?.focus();else if(qFocus==='tag-query')$('tag-query').focus()}
function closePopup(returnFocus=false){$('popup').classList.add('hidden');$('toggle').setAttribute('aria-expanded','false');if(returnFocus)$('toggle').focus()}
$('toggle').onclick=()=>{const open=$('popup').classList.contains('hidden');$('popup').classList.toggle('hidden',!open);$('toggle').setAttribute('aria-expanded',String(open));if(open)$('tag-query').focus()};$('close').onclick=()=>closePopup(true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('popup').classList.contains('hidden')){e.preventDefault();closePopup(true)}});document.addEventListener('pointerdown',e=>{if(!$('popup').contains(e.target)&&!$('toggle').contains(e.target))closePopup()});
let composing=false;$('query').addEventListener('compositionstart',()=>composing=true);$('query').addEventListener('compositionend',()=>{composing=false;page=1;render()});$('query').oninput=()=>{if(!composing){page=1;render()}};$('tag-query').oninput=renderCandidates;$('sort').onchange=()=>{page=1;render()};
$('scenario').onchange=()=>{tags=[...originalTags];selected=new Set([0]);page=1;failed=false;initial=false;notification='';$('query').value='';$('tag-query').value='';const state=$('scenario').value;if(state==='many')selected=new Set([0,1,3,4,5,6]);if(state==='zero')selected=new Set([0,7]);if(state==='failed')failed=true;if(state==='initial'){initial=true;selected.clear()}if(state==='deleted'){tags[1]='';notification='削除されたタグ「毎週更新」を条件から外しました。残った「ファンタジー」で絞り込んでいます。'}render()};
render();
const params=new URLSearchParams(location.search);if(params.has('narrow')){$('scenario').value='many';$('scenario').onchange()}if(params.has('open'))$('toggle').click();
if(params.has('check')){const checks=[];const assert=(name,ok)=>checks.push({name,ok});assert('AND counts',matching(new Set([0,1])).length===10);assert('unused selectable',matching(new Set([7])).length===0);assert('width search',normalize('ﾏﾝｶﾞ')===normalize('マンガ'));$('toggle').click();assert('open focuses search',document.activeElement===$('tag-query'));closePopup(true);assert('close keeps selection and focus',selected.has(0)&&document.activeElement===$('toggle'));updateCondition(7);assert('zero guidance',$('works').textContent.includes('一致する作品がありません'));$('scenario').value='failed';$('scenario').onchange();const previous=[...selected].join();updateCondition(1);assert('failed blocks conditions',[...selected].join()===previous&&[...$('candidates').querySelectorAll('input')].every(x=>x.disabled));const output=el('pre',JSON.stringify(checks));output.id='self-check';document.body.append(output);document.title=checks.every(x=>x.ok)?'CHECK PASS':'CHECK FAIL'}
</script>
</html>
