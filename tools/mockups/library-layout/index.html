<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品一覧・3形式の画面サンプル</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#183451;font:14px/1.5 'Yu Gothic UI',Meiryo,sans-serif}main{padding:20px;max-width:1200px;margin:auto}h1{font-size:24px;margin:4px 0 16px}h2{font-size:18px;margin:0}button,summary{font:inherit;cursor:pointer}button{border:1px solid #bbc9d6;background:white;border-radius:7px;padding:8px 12px;color:inherit}button[aria-pressed=true]{background:#164c68;color:white;border-color:#164c68}button:focus-visible,summary:focus-visible{outline:3px solid #2191b5;outline-offset:2px}.banner{background:#e4eff2;border-radius:8px;padding:10px 14px;margin-bottom:16px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}.toolbar span{margin-right:auto}.search{display:block;margin:12px 0 18px}.search input{display:block;width:100%;padding:10px;border:1px solid #bbc9d6;border-radius:7px;font:inherit}.panel{padding:18px;border:1px solid #d9e1e8;background:white;border-radius:12px;min-width:0}.list{list-style:none;padding:0;margin:0}.title{font-size:15px;font-weight:650;margin:0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;height:45px;line-height:22px}.cover{width:120px;height:160px;background:#edf2f6;border:0;border-radius:5px;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}.cover svg{max-width:100%;max-height:100%;display:block}.placeholder{font-size:32px;color:#94a9bb}.entry{position:relative;min-width:0;border:1px solid #d9e1e8;border-radius:9px}.more{position:relative;flex-shrink:0}.more summary{list-style:none;border:1px solid #c6d2dc;border-radius:5px;width:30px;height:28px;text-align:center;line-height:23px;background:white;font-weight:bold}.more summary::-webkit-details-marker{display:none}.more[open]{z-index:2}.menu{position:absolute;right:0;top:32px;width:164px;background:white;border:1px solid #b8c9d4;border-radius:7px;padding:6px;box-shadow:0 8px 24px #17344e30}.menu button{display:block;width:100%;border:0;text-align:left;padding:7px}.compact{display:grid;grid-template-columns:repeat(auto-fill,144px);gap:12px}.compact .entry{width:144px;padding:11px}.compact .title{margin-top:8px}.compact .more{position:absolute;right:4px;top:4px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}.cards .entry{height:164px;padding:14px;display:flex;gap:12px}.cards .cover{width:80px;height:108px}.details{min-width:0;flex:1}.meta{height:21px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#62788b;margin:4px 0}.url{display:block;width:100%;padding:0;background:none;border:0;border-radius:0;text-align:left;color:#076288;text-decoration:underline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:22px}.cards .more{position:absolute;right:8px;top:8px}.cards .title{padding-right:22px}.table-wrap{overflow-x:auto}.rows{width:100%;min-width:850px;border-collapse:collapse;table-layout:fixed}.rows th{text-align:left;background:#edf2f6;padding:10px 12px;font-size:13px}.rows td{padding:10px 12px;border-bottom:1px solid #e2e8ee;height:54px}.rows .title{display:block;height:22px;white-space:nowrap;text-overflow:ellipsis}.rows th:nth-child(1){width:30%}.rows th:nth-child(2){width:39%}.rows th:nth-child(3){width:25%}.rows th:nth-child(4){width:6%}.rows .meta{margin:0}.foot{font-size:12px;color:#667b8e;margin:16px 0 0}.sample-label{font-size:12px;color:#667b8e}.comparison{background:#e9eef3;padding:22px;max-width:none}.compare-row{display:flex;gap:20px;align-items:flex-start;margin-bottom:24px}.frame-box{overflow:hidden;background:white;border:1px solid #b9c9d8;border-radius:9px}.frame-box iframe{border:0;transform:scale(.7);transform-origin:top left;display:block}.frame-box.wide{width:718px;height:450px}.frame-box.narrow{width:366px;height:450px}.frame-box.wide iframe{width:1024px;height:640px}.frame-box.narrow iframe{width:520px;height:640px}.comparison h2{margin-bottom:8px}.comparison header{margin-bottom:16px}
/* 詰めた案。説明は比較ページの枠外だけに置く。製品仕様としては未確定。 */
main{padding:12px}.panel{padding:12px}.toolbar{display:grid;grid-template-columns:auto minmax(140px,1fr) auto auto;gap:12px;align-items:center;margin-bottom:12px}.toolbar .count{white-space:nowrap;margin:0}.search{margin:0;min-width:0}.search input{height:34px;padding:6px 10px}.modes{display:flex;gap:4px}.toolbar button{height:34px;padding:5px 10px;white-space:nowrap}.registration{background:#e8f1f4}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.foot{display:none}
@media(max-width:700px){.toolbar{grid-template-columns:1fr auto auto;gap:8px;margin-bottom:10px}.search{grid-row:2;grid-column:1/-1}.toolbar .count{font-size:13px}.toolbar button{padding:5px 8px}}
.toolbar{grid-template-columns:1fr auto auto;gap:8px}.search{grid-row:2;grid-column:1/-1}.pager{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:10px 0}.pager button{padding:4px 9px;min-height:32px}.pager span{margin-right:auto;color:#62788b;font-size:12px}.pager button:disabled{opacity:.4;cursor:default}.pager button[aria-current=page]{background:#164c68;color:white}.empty{padding:24px;text-align:center;color:#62788b}
.title{font-size:17px;line-height:24px;height:48px}.rows .title{height:24px}
.compact .entry{width:auto}.compact .cover{width:120px;max-width:100%;height:160px;margin-inline:auto}.cards .cover{width:100px;height:134px}
.compact{grid-template-columns:repeat(var(--compact-columns,5),minmax(0,1fr))}.compact .cover{width:120px;height:160px}.compact .title{-webkit-line-clamp:3;height:72px}.columns-comparison .frame-box{width:1026px;height:482px;margin:8px 0 22px}.columns-comparison iframe{width:1024px;height:480px;transform:none}.columns-comparison h2{margin:0}.columns-comparison main{max-width:none}
@media(max-width:700px){.compact{grid-template-columns:repeat(2,minmax(0,1fr))}}
.compact[style*="--compact-columns:5"] .cover{width:140px;height:187px}
.rows tbody tr:nth-child(odd){background:#fff}.rows tbody tr:nth-child(even){background:#edf3f8}
.rows tbody tr:hover,.rows tbody tr:focus-within{background:#d5e4f0}
.compact .entry:hover,.compact .entry:focus-within,.cards .entry:hover,.cards .entry:focus-within{background:#d5e4f0}
.more summary{width:40px;height:40px;line-height:34px;font-size:22px}.menu{top:44px}.cards .title{padding-right:34px}.rows th:nth-child(2){width:37%}.rows th:nth-child(4){width:8%}
.compact .entry{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 4px;padding:10px;align-content:start}.compact .cover{grid-row:1;grid-column:1;margin-inline:auto;max-width:100%}.compact .title{grid-row:2;grid-column:1;margin-top:0;padding-inline:0}.compact .more{position:relative;grid-row:3;grid-column:1;right:auto;top:auto;align-self:start;justify-self:stretch;min-width:0}.compact .more summary{width:100%;height:28px;line-height:22px;font-size:22px}.compact .menu{top:32px;bottom:auto}
</style>
<main id="app"></main>
<script>
const titles=['星をめぐる旅','雨の日の図書室と、名前を忘れた魔法使いの長い長い物語','放課後の珈琲店','青の街','月曜日の冒険者','小さな庭の記録','週末は遠い町で','海辺の約束'];
const works=Array.from({length:60},(_,i)=>({title:titles[i%titles.length]+(i<8?'':' '+String(i+1).padStart(2,'0')),url:i===1?'https://example.com/series/very-long-series-name/episodes/000000000000000000000000001':'https://example.com/series/'+(i+1),site:i%3===0?'':i%2?'架空コミック':'サンプル書店',at:i%3===0?'未アクセス':'2026/10/24 09:30',kind:i%8===2?'missing':i%8===3?'wide':'book',tone:['#548095','#908b63','#6c8a75','#687fa2'][i%4]}));
const params=new URLSearchParams(location.search);const app=document.getElementById('app');let mode=params.get('mode')||'cards';if(!['compact','rows','cards'].includes(mode))mode='cards';let query='';let page=1;
const pageSizes={compact:24,rows:20,cards:12};
const compactColumns=[4,5,6].includes(Number(params.get('columns')))?Number(params.get('columns')):5;
if(params.has('compareColumns')){
 document.body.className='comparison columns-comparison';app.style.padding='0';app.innerHTML='<header><h1>小型表示：横6件・5件・4件の比較</h1><p>すべて幅1024px・実寸表示。5件表示の画像枠は140×187px、6件・4件は120×160px。タイトル17px・最大3行の仮案です。</p></header>';
 for(const columns of [6,5,4]){const section=document.createElement('section');section.innerHTML='<h2>横'+columns+'件</h2><div class="frame-box"><iframe title="小型表示・横'+columns+'件" src="?mode=compact&columns='+columns+'"></iframe></div>';app.append(section)}
}else if(params.has('compare')){
 document.body.className='comparison';app.style.padding='0';app.innerHTML='<header><h1>ページ切替付き・一覧3形式の比較案</h1><p>通常幅1024px ／ 狭い幅520pxを70%縮小表示。架空60作品。小型24件・行20件・カード12件は仮案です。各枠内をスクロールするとページ下端も確認できます。</p></header>';
 for(const [key,label] of [['compact','小型表示：通常幅5列・画像140×187px・タイトル3行（仮）'],['rows','画像なし行一覧：狭い幅では表内横スクロール'],['cards','メモなしカード：画像100×134px・カード高さは維持（仮）']]){const section=document.createElement('section');section.innerHTML='<h2>'+label+'</h2><div class="compare-row"><div class="frame-box wide"><iframe title="通常幅の'+label+'" src="?mode='+key+'"></iframe></div><div class="frame-box narrow"><iframe title="狭い幅の'+label+'" src="?mode='+key+'"></iframe></div></div>';app.append(section)}
}else{
 app.innerHTML='<section class="panel" aria-label="作品一覧の画面案"><div class="toolbar"><span class="count"><strong>登録した作品</strong>　8件</span><label class="search"><span class="sr-only">漫画名で検索</span><input type="search" placeholder="漫画名で検索"></label><div class="modes" role="group" aria-label="表示形式"><button data-mode="compact">小型</button><button data-mode="rows">行一覧</button><button data-mode="cards">カード</button></div><button class="registration" title="サンプルのため登録は実行しません">作品を登録</button></div><div id="results"></div></section>';
 document.querySelector('input').addEventListener('input',e=>{query=e.target.value;page=1;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;page=1;render();window.scrollTo(0,0)});
 document.getElementById('results').addEventListener('click',e=>{const button=e.target.closest('button[data-page]');if(!button||button.disabled)return;page=Number(button.dataset.page);render();window.scrollTo(0,0);document.querySelector('#results .pager button[aria-current="page"]')?.focus({preventScroll:true});});render();
}
function menu(w){return '<details class="more"><summary aria-label="'+w.title+'の作品操作">⋯</summary><div class="menu">'+['編集','削除','画像を設定・変更','画像を外す'].map(s=>'<button type="button" title="サンプルのため実行しません">'+s+'</button>').join('')+'</div></details>'}
function cover(w,open){const art=w.kind==='missing'?'<span class="placeholder">本</span>':'<svg viewBox="0 0 '+(w.kind==='wide'?'180 96':'120 160')+'" aria-hidden="true"><rect width="100%" height="100%" fill="'+w.tone+'"/><circle cx="40" cy="45" r="28" fill="#ffffff33"/><path d="M0 150L120 50V160H0Z" fill="#ffffff22"/><text x="12" y="'+(w.kind==='wide'?'60':'118')+'" fill="white" font-size="14">SAMPLE</text></svg>';return open?'<button class="cover" aria-label="'+w.title+'の登録URLを開く（サンプル）">'+art+'</button>':'<div class="cover">'+art+'</div>'}
function name(w){return '<h2 class="title" title="'+w.title+'">'+w.title+'</h2>'}
function url(w){return '<button class="url" title="'+w.url+'" aria-label="'+w.title+'のURLを開く（サンプル）">'+w.url+'</button>'}
function pagination(total,pages,position){
 const start=total?(page-1)*pageSizes[mode]+1:0;const end=Math.min(page*pageSizes[mode],total);
 return '<nav class="pager" aria-label="'+position+'のページ切替"><span>'+start+'–'+end+'件 / '+total+'件（1ページ'+pageSizes[mode]+'件）</span><button data-page="'+(page-1)+'" '+(page===1?'disabled':'')+'>前へ</button>'+Array.from({length:pages},(_,i)=>'<button data-page="'+(i+1)+'" '+(page===i+1?'aria-current="page"':'')+' aria-label="'+(i+1)+'ページ目">'+(i+1)+'</button>').join('')+'<button data-page="'+(page+1)+'" '+(page===pages?'disabled':'')+'>次へ</button></nav>';
}
function render(){
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
 const filtered=works.filter(w=>w.title.includes(query));const pages=Math.max(1,Math.ceil(filtered.length/pageSizes[mode]));page=Math.min(Math.max(1,page),pages);
 const data=filtered.slice((page-1)*pageSizes[mode],page*pageSizes[mode]);
 document.querySelector('.count').innerHTML='<strong>登録した作品</strong>　'+filtered.length+' / '+works.length+'件';
 let list='';
 if(!data.length)list='<p class="empty">検索条件に一致する作品がありません</p>';
 else if(mode==='rows')list='<div class="table-wrap"><table class="rows"><thead><tr><th>タイトル</th><th>URL</th><th>最終アクセス</th><th>操作</th></tr></thead><tbody>'+data.map(w=>'<tr><td>'+name(w)+'</td><td>'+url(w)+'</td><td><p class="meta">'+w.at+'</p></td><td>'+menu(w)+'</td></tr>').join('')+'</tbody></table></div>';
 else list='<ul class="list '+(mode==='compact'?'compact':'cards')+'" style="--compact-columns:'+compactColumns+'">'+data.map(w=>'<li class="entry">'+cover(w,mode==='compact')+(mode==='compact'?name(w):'<div class="details">'+name(w)+'<p class="meta">'+w.site+'</p>'+url(w)+'<p class="meta">最終アクセス '+w.at+'</p></div>')+menu(w)+'</li>').join('')+'</ul>';
 document.getElementById('results').innerHTML=pagination(filtered.length,pages,'上部')+list+pagination(filtered.length,pages,'下部');
}
</script>
</html>
