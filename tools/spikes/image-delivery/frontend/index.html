<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>画像表示の事前検証</title>
<style>body{font:16px sans-serif;margin:30px;color:#18304c}img{width:120px;height:180px;object-fit:contain}pre{white-space:pre-wrap}button{padding:10px;margin:5px}</style>
<h1>画像表示の事前検証</h1>
<p>仮画像専用。通常アプリのDBや利用者画像は使いません。</p>
<img id="cover" alt="仮画像"><span id="placeholder" hidden>画像なし（仮表示）</span>
<div><button data-state="red">赤</button><button data-state="blue">青</button><button data-state="missing">欠損</button><button data-state="broken">破損</button><button data-state="unset">未設定</button></div>
<pre id="result">Go APIの準備を待っています。</pre>
<script type="module" src="/probe.js"></script>
</html>
